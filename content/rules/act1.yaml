# The M1 rulebook. Rules are chips: the first rule whose conditions all hold decides the case.
# When scoring the player, conditions read each field's TRUE value. A case no rule catches is approved.
rules:
  - id: tower_guild_seal
    glyph: "Tower over 5 floors ⇒ Guild seal"
    text: Towers over 5 floors need a genuine Guild seal.
    if:
      - { field: permit, op: eq, value: tower }
      - { field: floors, op: gt, value: 5 }
      - { field: seal, op: neq, value: guild }
    then: deny

  - id: bakery_guild_seal
    glyph: "Sign over 3 m ⇒ Guild seal"
    text: Bakery signs over 3 metres need a genuine Guild seal.
    if:
      - { field: permit, op: eq, value: bakery }
      - { field: sign_m, op: gt, value: 3 }
      - { field: seal, op: neq, value: guild }
    then: deny

  - id: dragon_thatch
    glyph: "Dragon + thatch ⇒ DENY"
    text: Dragons may not live in thatched housing.
    if:
      - { field: permit, op: eq, value: dragon }
      - { field: dwelling, op: has, value: thatch }
    then: deny

  - id: dragon_species
    glyph: "Not a dragon ⇒ DENY"
    text: Dragon Residency is for dragons only.
    if:
      - { field: permit, op: eq, value: dragon }
      - { field: species, op: neq, value: dragon }
    then: deny

  - id: forged_seal
    glyph: "Forged seal ⇒ DENY"
    text: Forged seals are always denied.
    if:
      - { field: seal, op: eq, value: forged }
    then: deny
