name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:single
      # Download this from the run page and open it locally (works from file://), or on a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: office-of-permits-build
          path: dist-single/index.html
